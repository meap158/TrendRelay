[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trendrelay-api"
version = "0.1.0"
description = "TrendRelay Python control plane"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<2.1",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# Only Studio's face blur needs these, and it imports them lazily, so a machine
# that never blurs does not carry ~40MB of native wheels to boot the API.
# Headless: the API never opens a window, and the GUI build pulls in GTK.
vision = [
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
]
# InsightFace, for identity-aware face work. Separate from `vision` because the
# code is MIT but its pretrained models are non-commercial, so this is a
# deliberate choice rather than something a plain install should pick up.
#
# Install with `--no-deps` and let `vision` supply cv2. InsightFace declares a
# dependency on `opencv-python`, which is the GUI build and a *different*
# distribution from the headless one above; installing it plainly lands both in
# the same environment, both providing `cv2`, and pip resolves it to a 5.x that
# this project's own constraint excludes. That is not hypothetical - it is what
# happened, and it silently replaced the OpenCV the editing suite was verified
# against until the version assertion caught it.
faces = [
  "insightface>=1.0.1,<2",
  "onnxruntime>=1.20,<2",
  "onnx>=1.17,<2",
  "scikit-image>=0.24,<1",
  "scipy>=1.14,<2",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trendrelay_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
